# ============================================
# cpa-external 后端镜像自动构建
#
# 触发：任意代码推送、打 v* 标签、或手动触发（workflow_dispatch）
# 标签策略：不写死分支名，latest 仅在默认分支构建时移动，
#           其他分支只产出 commit 短哈希标签
# 流程：
#   1. Maven 构建（含测试）产出 ruoyi-admin.jar
#   2. 用 docker/cpa-external/Dockerfile 构建镜像
#   3. 推送到 ghcr.io/<owner>/cpa-external（latest + commit 短哈希 + 版本标签）
# 服务器侧执行 docker/deploy-server.sh update 即可拉取更新
#
# 说明：ghcr 私有镜像需要在服务器上 docker login ghcr.io，
#       或在 GitHub Package 设置里将镜像改为 public
# ============================================
name: build-image

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven 打包（含测试）
        run: mvn -B clean package

      - name: 暂存 jar 到镜像构建上下文
        run: cp ruoyi-admin/target/ruoyi-admin.jar docker/cpa-external/app.jar

      - name: 计算镜像名（owner 转小写）
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cpa-external" >> "$GITHUB_OUTPUT"

      - name: 提取镜像标签（latest + 短哈希 + 版本标签）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=tag

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: docker/cpa-external
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
